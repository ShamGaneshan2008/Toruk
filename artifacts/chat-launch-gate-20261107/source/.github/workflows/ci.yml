name: CPU foundation
on: [push, pull_request, workflow_dispatch]
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web/vercel run check
      - run: npm --prefix web/vercel test
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pytest includes the page-handler -> Node proxy -> Python HTTP fixture contract.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Static checks cover the optional chat backend too; no model download is needed.
      - run: python -m pip install -e '.[dev,chat]'
      - run: python -m pip check
      - run: python -c "import toruk_lm; print(toruk_lm.__version__)"
      - run: python -m toruk_lm --help
      - run: python -m toruk_lm diagnose
      # Archived experiment sources are byte-frozen, not reformatted for CI.
      - run: python scripts/check_frozen_sources.py
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy
      - run: python -m mypy --platform linux
      - run: python -m pytest -q
      # Validate the independent evaluation contract without downloading chat weights.
      # Full inference reproduction requires the separately pinned local backbone.
      - run: python scripts/independent_replication.py validate-cases --run artifacts/ci-independent-cases
      # No model download/training: role framing, splits and a fail-closed exposure gate.
      - run: python scripts/conversation_readiness.py validate --output artifacts/ci-conversation-data
      # Bounded from-scratch next-token train/resume/eval/ablation; no chat weights.
      - run: python scripts/study_owned_lm.py --config configs/owned-lm-smoke-v1.json --output artifacts/ci-owned-lm
      - run: python -m toruk_lm.owned_lm generate --checkpoint artifacts/ci-owned-lm/models/23-memory_on/checkpoint.pt --prompt "Experimental CPU smoke" --max-new-tokens 4
      - run: python -m toruk_lm reproduce --config configs/foundation.json --output artifacts/ci-smoke
      - run: python -m toruk_lm validate --manifest artifacts/ci-smoke/data/manifest.json --config configs/foundation.json --checkpoint artifacts/ci-smoke/train/checkpoint.pt
      - run: python -m toruk_lm summarize --run artifacts/ci-smoke --output artifacts/ci-tables
      - run: python -m toruk_lm validate-config --config configs/reproduce-smoke-v1.json
      - run: python -m toruk_lm reproduce --config configs/reproduce-smoke-v1.json --output artifacts/ci-research-smoke
      - run: python -m build --no-isolation
